<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img"><title>CANÁRIO AMARELO BIM | Passo a passo</title><defs><linearGradient id="bg"><stop stop-color="#07152c"/><stop offset="1" stop-color="#142b4a"/></linearGradient><linearGradient id="line"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1800" height="1040" rx="36" fill="url(#bg)"/><text x="78" y="112" font-family="Arial" font-size="28" font-weight="800" letter-spacing="6" fill="#8edaff">IMPULSO DIGITAL SOLUÇÕES EM IA</text><text x="74" y="220" font-family="Arial" font-size="68" font-weight="900" fill="#fff">CANÁRIO AMARELO BIM</text><text x="78" y="276" font-family="Arial" font-size="31" fill="#c7d8ed">Speckle Automate para resumo de objetos e relatório assistido</text><rect x="78" y="300" width="1640" height="5" rx="2" fill="url(#line)"/><text x="78" y="385" font-family="Arial" font-size="29" font-weight="800" fill="#8edaff">FLUXO PASSO A PASSO</text><rect x="70" y="340" width="310" height="360" rx="26" fill="#101d36" stroke="#2563eb" stroke-width="3"/><circle cx="118" cy="392" r="27" fill="#2563eb"/><text x="118" y="402" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#fff">1</text><text x="94" y="462" font-family="Arial" font-size="27" font-weight="800" fill="#fff">RECEBER VERSÃO BIM</text><text x="94" y="518" font-family="Arial" font-size="24" fill="#dbeafe"><tspan x="94" dy="0">A automação recebe a versão do</tspan><tspan x="94" dy="34">modelo publicada no Speckle.</tspan></text><path d="M385 520h22m-9 -10l10 10 -10 10" fill="none" stroke="#9fb7d7" stroke-width="5"/><rect x="418" y="340" width="310" height="360" rx="26" fill="#101d36" stroke="#0d9488" stroke-width="3"/><circle cx="466" cy="392" r="27" fill="#0d9488"/><text x="466" y="402" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#fff">2</text><text x="442" y="462" font-family="Arial" font-size="27" font-weight="800" fill="#fff">LER OBJETOS</text><text x="442" y="518" font-family="Arial" font-size="24" fill="#dbeafe"><tspan x="442" dy="0">Coletar uma amostra limitada e</tspan><tspan x="442" dy="34">contar tipos de objetos.</tspan></text><path d="M733 520h22m-9 -10l10 10 -10 10" fill="none" stroke="#9fb7d7" stroke-width="5"/><rect x="766" y="340" width="310" height="360" rx="26" fill="#101d36" stroke="#7c3aed" stroke-width="3"/><circle cx="814" cy="392" r="27" fill="#7c3aed"/><text x="814" y="402" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#fff">3</text><text x="790" y="462" font-family="Arial" font-size="27" font-weight="800" fill="#fff">MONTAR RESUMO</text><text x="790" y="518" font-family="Arial" font-size="24" fill="#dbeafe"><tspan x="790" dy="0">Preparar um resumo textual dos</tspan><tspan x="790" dy="34">dados extraídos do modelo.</tspan></text><path d="M1081 520h22m-9 -10l10 10 -10 10" fill="none" stroke="#9fb7d7" stroke-width="5"/><rect x="1114" y="340" width="310" height="360" rx="26" fill="#101d36" stroke="#d97706" stroke-width="3"/><circle cx="1162" cy="392" r="27" fill="#d97706"/><text x="1162" y="402" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#fff">4</text><text x="1138" y="462" font-family="Arial" font-size="27" font-weight="800" fill="#fff">GERAR ANÁLISE</text><text x="1138" y="518" font-family="Arial" font-size="24" fill="#dbeafe"><tspan x="1138" dy="0">Enviar o resumo ao provedor</tspan><tspan x="1138" dy="34">OpenAI quando configurado.</tspan></text><path d="M1429 520h22m-9 -10l10 10 -10 10" fill="none" stroke="#9fb7d7" stroke-width="5"/><rect x="1462" y="340" width="310" height="360" rx="26" fill="#101d36" stroke="#db2777" stroke-width="3"/><circle cx="1510" cy="392" r="27" fill="#db2777"/><text x="1510" y="402" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#fff">5</text><text x="1486" y="462" font-family="Arial" font-size="27" font-weight="800" fill="#fff">PUBLICAR RELATÓRIO</text><text x="1486" y="518" font-family="Arial" font-size="24" fill="#dbeafe"><tspan x="1486" dy="0">Produzir relatórios HTML e</tspan><tspan x="1486" dy="34">Markdown para revisão humana.</tspan></text><rect x="76" y="770" width="1648" height="176" rx="28" fill="#0b1427" stroke="#47617e" stroke-width="2"/><text x="112" y="830" font-family="Arial" font-size="25" font-weight="800" fill="#8edaff">RESULTADO / LIMITE DO FLUXO</text><text x="112" y="890" font-family="Arial" font-size="30" fill="#fff">Relatório assistido por IA sobre amostra do modelo. Não substitui auditoria BIM nem validação de engenharia.</text><text x="78" y="995" font-family="Arial" font-size="21" fill="#93a9c4">Diagrama explicativo do fluxo documentado ou proposto; não representa captura de execução.</text></svg>